version: "3.9"

services:
  app:
    image: python:3.12-slim
    container_name: chatbot-dashboard-dev
    working_dir: /app
    volumes:
      - .:/app
      - pip_cache:/root/.cache/pip
      - site_packages:/usr/local/lib/python3.12/site-packages
    ports:
      - "8501:8501"
    command: >
      bash -c "
        pip install --no-cache-dir -r requirements.txt &&
        streamlit run main.py --server.port=8501 --server.address=0.0.0.0 --server.runOnSave true
      "

volumes:
  pip_cache:
  site_packages:
