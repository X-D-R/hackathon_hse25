name: 🚀 Chatbot Dasboard

on:
  push:
    tags:
      - 'v*'

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 📂 Checkout code
        uses: actions/checkout@v3

      - name: 🔐 Connect via SSH and run deployment
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            cd /home/chatbot/dashboard
            git fetch --all --tags
            git checkout ${{ github.ref_name }}
            git reset --hard origin/${{ github.ref_name }}
            make rebuild
